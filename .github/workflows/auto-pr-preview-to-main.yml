name: Auto PR - preview to main

# Mirrors auto-pr-development-to-preview.yml one stage further along: every
# push to preview waits for that commit's "Deploy Preview Backend to AWS
# EC2" run to finish, then — only if it succeeded — opens (or leaves alone,
# if one's already open) a PR promoting preview into main. A human still has
# to review and click merge: this workflow never merges on its own, never
# bypasses branch protection, and never force-merges. Note main's own
# production deploy workflow only triggers on changes under services/** or
# deploy/aws/**, so merging this PR will NOT itself redeploy production
# unless it actually touches those paths.
#
# Trigger note: this intentionally stays on `push` rather than
# `workflow_run` watching the deploy workflow. `workflow_run` listeners only
# fire when the *listening* workflow file exists on the repository's default
# branch, but main deliberately carries no promotion workflows (see
# deploy-production-aws-ec2.yml) — so a workflow_run trigger here would
# silently never run. Polling this push's own commit for the deploy
# conclusion gets the same "only after a successful deploy" behavior without
# relying on a file main will never have.

on:
  push:
    branches:
      - preview

concurrency:
  group: ggfix-auto-pr-preview-to-main
  cancel-in-progress: false

jobs:
  wait-for-deploy:
    name: Wait for Preview deploy to succeed
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      deploy_success: ${{ steps.wait.outputs.success }}
    steps:
      - name: Wait for this commit's deploy run to complete
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          echo "success=false" >> "$GITHUB_OUTPUT"

          for attempt in $(seq 1 60); do
            runs_json="$(gh run list --workflow "deploy-preview-aws-ec2.yml" --branch preview --json headSha,status,conclusion --limit 10)"
            match="$(echo "$runs_json" | jq -c --arg sha "$SHA" '[.[] | select(.headSha == $sha)] | first // empty')"

            if [ -n "$match" ]; then
              status="$(echo "$match" | jq -r '.status')"
              conclusion="$(echo "$match" | jq -r '.conclusion')"

              if [ "$status" = "completed" ]; then
                echo "Preview deploy run for $SHA completed with conclusion: $conclusion"
                if [ "$conclusion" = "success" ]; then
                  echo "success=true" >> "$GITHUB_OUTPUT"
                fi
                exit 0
              fi

              echo "Attempt $attempt: deploy run for $SHA is still '$status' — waiting..."
            else
              echo "Attempt $attempt: no deploy run found yet for $SHA — waiting..."
            fi

            sleep 30
          done

          echo "::warning::Timed out waiting for the Preview deploy run to complete; not opening a promotion PR."
          exit 0

  open-or-update-pr:
    name: Open promotion PR (preview -> main)
    needs: wait-for-deploy
    if: ${{ needs.wait-for-deploy.outputs.deploy_success == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Open PR if one isn't already open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          existing="$(gh pr list --base main --head preview --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "PR #$existing is already open (preview -> main) — GitHub already shows this push's new commits on it, nothing to do."
            exit 0
          fi

          # `if output=$(...)` (not a bare assignment) is deliberate: this
          # step's shell runs with `-e`, and a bare `output="$(cmd)"` where
          # cmd fails aborts the script right there, before any later check
          # ever runs — bash only exempts an `if` condition (and similar)
          # from errexit, not a plain assignment.
          if output="$(gh pr create --base main --head preview \
            --title "Promote preview to main" \
            --body "Auto-opened by CI after a successful push-to-preview deploy. Review and merge to bring \`main\` in sync. main's production deploy workflow only triggers on changes under services/** or deploy/aws/**, so merging this will NOT itself redeploy production unless this promotion actually touches those paths. This workflow never merges on its own." 2>&1)"; then
            echo "$output"
            exit 0
          fi

          # "No commits between main and preview" means main is already
          # fully caught up — that is success, not a failure.
          if echo "$output" | grep -qi "No commits between\|already exists"; then
            echo "Nothing to promote right now:"
            echo "$output"
            exit 0
          fi

          echo "$output" >&2
          exit 1
