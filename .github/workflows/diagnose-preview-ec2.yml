name: Diagnose Preview EC2

# Read-only diagnostic, manually triggered. SSHes into the preview EC2 host and
# dumps journalctl + free memory + process list, without touching the deploy
# archive, .env, or any systemd unit. For debugging service crash loops
# without paying for a full Maven build + redeploy cycle.

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Space-separated service names (short form, e.g. 'auth-service shop-service'). Empty = all."
        required: false
        default: ""
      lines:
        description: "journalctl line count per service"
        required: false
        default: "150"

permissions:
  contents: read

env:
  SERVICE_PREFIX: ggfix-preview
  EC2_PORT: "22"
  ALL_SERVICES: "auth-service user-service shop-service ticket-service technician-service inventory-service marketplace-service pickup-service notification-service subscription-service master-data-service order-service"

jobs:
  diagnose:
    name: Diagnose Preview EC2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview

    steps:
      - name: Decode SSH key and configure known_hosts
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY_B64: ${{ secrets.EC2_SSH_PRIVATE_KEY_B64 }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          : "${EC2_HOST:?EC2_HOST secret is required}"
          : "${EC2_SSH_PRIVATE_KEY_B64:?EC2_SSH_PRIVATE_KEY_B64 secret is required}"
          : "${EC2_KNOWN_HOSTS:?EC2_KNOWN_HOSTS secret is required}"

          install -d -m 700 "$HOME/.ssh"

          printf '%s' "$EC2_SSH_PRIVATE_KEY_B64" | base64 --decode > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Dump diagnostics
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SERVICES_INPUT: ${{ inputs.services }}
          LINES: ${{ inputs.lines }}
        run: |
          set -euo pipefail

          SERVICES="${SERVICES_INPUT:-$ALL_SERVICES}"

          ssh -i "$HOME/.ssh/id_ed25519" -p "$EC2_PORT" -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "SERVICE_PREFIX='$SERVICE_PREFIX' SERVICES='$SERVICES' LINES='$LINES' bash -s" <<'REMOTE_SCRIPT'
          set -uo pipefail

          echo "===== free -h ====="
          free -h

          echo
          echo "===== java processes ====="
          ps -eo pid,rss,vsz,etimes,cmd | grep -E '[j]ava' || echo "no java processes running"

          echo
          echo "===== .env (secrets redacted) ====="
          sudo sed -E 's/(PASSWORD|SECRET)=.*/\1=***REDACTED***/' /opt/ggfix/preview/.env 2>&1 || echo "no .env found"

          for service in $SERVICES; do
            unit="${SERVICE_PREFIX}@${service}"
            echo
            echo "===== $unit: status ====="
            sudo systemctl --no-pager --full status "$unit" || true
            echo
            echo "===== $unit: last $LINES journal lines ====="
            sudo journalctl -u "$unit" -n "$LINES" --no-pager || true
          done
          REMOTE_SCRIPT

      - name: Clean up local SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_ed25519"
