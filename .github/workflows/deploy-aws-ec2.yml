name: Deploy Backend to AWS EC2

on:
  workflow_dispatch:
    inputs:
      api_domain:
        description: "Public API domain fronted by nginx"
        required: false
        default: "api.ggfix.in"
      skip_tls:
        description: "Install nginx on :80 only, skip certbot (use if DNS/SG is not ready)"
        type: boolean
        required: false
        default: false
      skip_health_check:
        description: "Deploy without failing the job on an unhealthy service"
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
    paths:
      - "services/**"
      - "deploy/aws/**"
      - ".github/workflows/deploy-aws-ec2.yml"

# Two deploys writing /opt/repair-shop-saas at once would interleave jar copies
# and systemd restarts. Queue them instead.
concurrency:
  group: deploy-aws-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
      EC2_USER: ${{ secrets.AWS_EC2_USER }}
      EC2_PORT: ${{ secrets.AWS_EC2_PORT }}
      API_DOMAIN: ${{ inputs.api_domain || 'api.ggfix.in' }}
      CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
      SKIP_TLS: ${{ inputs.skip_tls && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend services
        run: mvn -f services/pom.xml clean package -DskipTests -B

      # Catches the failure mode where the A record and the deploy target have
      # drifted apart — otherwise the deploy "succeeds" onto a host that the
      # domain does not point at, and the health check fails with no clue why.
      - name: Verify DNS points at the deploy target
        shell: bash
        run: |
          set -uo pipefail
          : "${EC2_HOST:?AWS_EC2_HOST secret is required}"

          resolved="$(getent ahostsv4 "$API_DOMAIN" | awk '{print $1}' | sort -u | tr '\n' ' ')"
          echo "$API_DOMAIN resolves to: ${resolved:-<nothing>}"
          echo "deploy target (AWS_EC2_HOST): $EC2_HOST"

          if [[ -z "$resolved" ]]; then
            echo "::error::$API_DOMAIN does not resolve. Create the A record before deploying."
            exit 1
          fi

          # AWS_EC2_HOST may be a DNS name rather than an IP; resolve it too.
          target="$(getent ahostsv4 "$EC2_HOST" | awk '{print $1}' | sort -u | tr '\n' ' ')"
          target="${target:-$EC2_HOST}"

          for ip in $target; do
            if [[ " $resolved " == *" $ip "* ]]; then
              echo "OK: $API_DOMAIN -> $ip matches the deploy target."
              exit 0
            fi
          done

          echo "::error::$API_DOMAIN ($resolved) does not point at the deploy target ($target)."
          echo "::error::Point the A record at the deploy host, or update AWS_EC2_HOST."
          exit 1

      - name: Create deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          services=(
            auth-service
            user-service
            shop-service
            ticket-service
            technician-service
            inventory-service
            marketplace-service
            pickup-service
            notification-service
            subscription-service
            master-data-service
            order-service
          )

          rm -rf deploy-bundle repair-shop-saas-deploy.tgz
          mkdir -p deploy-bundle/services deploy-bundle/deploy/aws deploy-bundle/postgres
          cp -R deploy/aws/. deploy-bundle/deploy/aws/
          cp -R services/postgres/init deploy-bundle/postgres/init

          for service in "${services[@]}"; do
            mkdir -p "deploy-bundle/services/$service"
            cp "services/$service/target/$service-1.0.0-SNAPSHOT.jar" "deploy-bundle/services/$service/$service.jar"
          done

          tar -czf repair-shop-saas-deploy.tgz -C deploy-bundle .
          echo "bundle size: $(du -h repair-shop-saas-deploy.tgz | cut -f1)"

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${EC2_HOST:?AWS_EC2_HOST secret is required}"
          : "${SSH_PRIVATE_KEY:?AWS_EC2_SSH_KEY secret is required}"
          EC2_PORT="${EC2_PORT:-22}"

          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/aws_ec2_key
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/aws_ec2_key
          ssh-keyscan -p "$EC2_PORT" -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          EC2_USER="${EC2_USER:-ec2-user}"
          EC2_PORT="${EC2_PORT:-22}"

          scp -i ~/.ssh/aws_ec2_key -P "$EC2_PORT" repair-shop-saas-deploy.tgz "$EC2_USER@$EC2_HOST:/tmp/repair-shop-saas-deploy.tgz"

      - name: Deploy on EC2
        shell: bash
        run: |
          set -euo pipefail
          EC2_USER="${EC2_USER:-ec2-user}"
          EC2_PORT="${EC2_PORT:-22}"

          ssh -i ~/.ssh/aws_ec2_key -p "$EC2_PORT" "$EC2_USER@$EC2_HOST" \
            "API_DOMAIN='$API_DOMAIN' CERTBOT_EMAIL='${CERTBOT_EMAIL:-}' SKIP_TLS='$SKIP_TLS' bash -s" <<'REMOTE'
            set -euo pipefail
            rm -rf /tmp/repair-shop-saas-release
            mkdir -p /tmp/repair-shop-saas-release
            tar -xzf /tmp/repair-shop-saas-deploy.tgz -C /tmp/repair-shop-saas-release

            chmod +x /tmp/repair-shop-saas-release/deploy/aws/*.sh

            bash /tmp/repair-shop-saas-release/deploy/aws/install-ec2.sh
            bash /tmp/repair-shop-saas-release/deploy/aws/deploy-from-artifact.sh
            bash /tmp/repair-shop-saas-release/deploy/aws/setup-nginx-tls.sh
          REMOTE

      # The point of the whole workflow: prove api.ggfix.in actually serves the
      # freshly deployed code before calling the deploy a success.
      - name: Health check via ${{ env.API_DOMAIN }}
        if: ${{ !inputs.skip_health_check }}
        shell: bash
        env:
          API_BASE: https://${{ env.API_DOMAIN }}
          RETRIES: "30"
          RETRY_DELAY: "10"
        run: |
          if [[ "$SKIP_TLS" == "1" ]]; then
            export API_BASE="http://${API_DOMAIN}"
            echo "SKIP_TLS is set — probing over http instead of https."
          fi
          bash deploy/aws/health-check.sh

      - name: Report service status on failure
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          EC2_USER="${EC2_USER:-ec2-user}"
          EC2_PORT="${EC2_PORT:-22}"
          [[ -f ~/.ssh/aws_ec2_key ]] || exit 0

          ssh -i ~/.ssh/aws_ec2_key -p "$EC2_PORT" "$EC2_USER@$EC2_HOST" '
            echo "===== systemd units ====="
            systemctl list-units "repair-shop-saas@*" --no-pager --no-legend || true
            echo "===== failed units ====="
            systemctl list-units "repair-shop-saas@*" --state=failed --no-pager --no-legend || true
            echo "===== nginx ====="
            sudo nginx -t 2>&1 || true
            systemctl is-active nginx || true
            echo "===== last 40 lines of each failed unit ====="
            for u in $(systemctl list-units "repair-shop-saas@*" --state=failed --no-pager --no-legend | awk "{print \$1}"); do
              echo "--- $u"
              sudo journalctl -u "$u" -n 40 --no-pager || true
            done
            echo "===== disk ====="
            df -h / | tail -1
          ' || true
