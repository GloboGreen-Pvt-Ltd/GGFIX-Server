# File-backed H2 — data PERSISTS across restarts. DB file lives at
# ./data/masterdata.mv.db relative to the master-data-service working dir.
# Run with: spring.profiles.active=dev
# To wipe and start fresh: delete ./data/ folder, then restart.
spring:
  datasource:
    url: jdbc:h2:file:./data/masterdata;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  servlet:
    multipart:
      enabled: true
      # Matches the default profile: sized for a 30s device coverage video.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:52MB}

server:
  port: ${PORT:8091}

# Uploads go to S3 behind media.ggfix.in — there is no local fallback any more
# (the base64 one wrote multi-MB data URIs into URL columns). To upload from a dev
# machine, set MEDIA_S3_BUCKET and have credentials the SDK's default chain can
# find: AWS_PROFILE, AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY, or ~/.aws/credentials.
# Without them every upload returns 502 and GET /media/ping reports "s3":"disabled";
# the rest of master-data works unaffected.
