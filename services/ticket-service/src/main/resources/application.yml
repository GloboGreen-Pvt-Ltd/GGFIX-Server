spring:
  application:
    name: ticket-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:repairshop}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Busiest service (Jobs list + per-ticket invoice reads + WhatsApp worker):
      # 5 connections were held long enough that requests waited 20s+ for one.
      maximum-pool-size: ${TICKET_DB_POOL_SIZE:12}
      minimum-idle: 2
      connection-timeout: 10000
      # Logs the stack of any code holding a connection > 15s (diagnostic only).
      leak-detection-threshold: 15000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: public
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8082}

app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-for-repair-shop-saas-jwt-signing}
  # WhatsApp booking confirmations via BotBee Nexa. OFF until Meta approves the
  # template: BOTBEE_WHATSAPP_ENABLED=true AND BOTBEE_API_KEY set. Never put the key here.
  whatsapp:
    enabled: ${BOTBEE_WHATSAPP_ENABLED:false}
    base-url: ${BOTBEE_BASE_URL:https://nexa.botbee.io}
    api-key: ${BOTBEE_API_KEY:}
    channel-id: ${BOTBEE_CHANNEL_ID:}
    booking-template: ${BOTBEE_BOOKING_TEMPLATE:neargfix_booking_confirmed}
    language: ${BOTBEE_TEMPLATE_LANGUAGE:en}
    fallback-header-image-url: ${BOTBEE_FALLBACK_HEADER_IMAGE_URL:}
    receipt-bucket: ${AWS_S3_BUCKET:${MEDIA_S3_BUCKET:}}
    receipt-region: ${AWS_REGION:${MEDIA_S3_REGION:ap-south-1}}
    public-base-url: ${AWS_S3_BASE_URL:https://cdn.neargfix.com}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
