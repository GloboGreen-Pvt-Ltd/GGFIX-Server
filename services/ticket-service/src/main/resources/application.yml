spring:
  application:
    name: ticket-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:repairshop}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  sql:
    init:
      # Adds the category device-spec columns before Hibernate's validate runs
      # (db/device-specs-columns.sql), so this service starts even if migration
      # 98 hasn't been applied yet. continue-on-error: a failed ALTER is logged
      # and validate then decides, exactly as without this step.
      mode: always
      schema-locations: classpath:db/device-specs-columns.sql
      data-locations: optional:classpath:db/no-seed-data.sql
      continue-on-error: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: public
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8082}

app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-for-repair-shop-saas-jwt-signing}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
