# ggfix backend — single TLS endpoint, path-prefix routed to each service port.
#
# Installed to /etc/nginx/conf.d/ggfix-api.conf by deploy/aws/setup-nginx-tls.sh.
# __SERVER_NAME__ is substituted with the API domain (default api.ggfix.in).
#
# certbot --nginx rewrites this server block in place to add `listen 443 ssl`
# plus the 80 -> 443 redirect, so keep the `server_name` line intact and let
# certbot own the TLS directives.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # KYC / media uploads (Aadhaar + PAN images, device photos, voice notes)
    client_max_body_size 25m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Edge liveness probe. Answers as soon as nginx + TLS are up, without
    # depending on any Java service — lets the deploy health gate tell
    # "DNS/TLS/nginx broken" apart from "a service is down".
    location = /health {
        access_log off;
        add_header Content-Type application/json always;
        return 200 '{"status":"UP","component":"nginx"}';
    }

    # Let's Encrypt HTTP-01 renewal challenges.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # One prefix per service. Trailing slashes on both sides are required:
    # /auth/login -> 127.0.0.1:8081/login, /auth/actuator/health -> :8081/actuator/health
    location /auth/         { proxy_pass http://127.0.0.1:8081/; }
    location /ticket/       { proxy_pass http://127.0.0.1:8082/; }
    location /user/         { proxy_pass http://127.0.0.1:8083/; }
    location /shop/         { proxy_pass http://127.0.0.1:8084/; }
    location /technician/   { proxy_pass http://127.0.0.1:8085/; }
    location /inventory/    { proxy_pass http://127.0.0.1:8086/; }
    location /marketplace/  { proxy_pass http://127.0.0.1:8087/; }
    location /pickup/       { proxy_pass http://127.0.0.1:8088/; }
    location /notification/ { proxy_pass http://127.0.0.1:8089/; }
    location /subscription/ { proxy_pass http://127.0.0.1:8090/; }
    location /master/       { proxy_pass http://127.0.0.1:8091/; }
    location /order/        { proxy_pass http://127.0.0.1:8092/; }

    # Bare prefix without the trailing slash (e.g. /auth) -> redirect to /auth/
    location ~ ^/(auth|ticket|user|shop|technician|inventory|marketplace|pickup|notification|subscription|master|order)$ {
        return 308 $scheme://$host$uri/;
    }

    location = / {
        add_header Content-Type application/json always;
        return 200 '{"service":"ggfix-api","status":"UP"}';
    }
}
